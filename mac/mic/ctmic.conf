
; ---- added by mac/mic/install-mic.sh (Car Thing as a Mac microphone) ----
[program:ctmic]
command=/usr/bin/python3 -u /usr/share/carthing-mic/ctmic.py
priority=99
autostart=true
autorestart=true
startsecs=2
redirect_stderr=true
stdout_logfile=/var/log/ctmic.log
stdout_logfile_maxbytes=100000
stdout_logfile_backups=1
